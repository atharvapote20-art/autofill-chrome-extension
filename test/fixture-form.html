<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Secure Form Vault — test form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 24px auto;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Local test form</h1>
    <p>Serve this folder with any static server, then use the extension popup “Fill this tab”.</p>
    <form>
      <label for="fullName">Full name</label>
      <input id="fullName" name="full_name" type="text" />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" />

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" />

      <label for="addr1">Street address</label>
      <input id="addr1" name="address_line_1" type="text" />

      <label for="city">City</label>
      <input id="city" name="city" type="text" />

      <label for="region">State / Province</label>
      <input id="region" name="region" type="text" />

      <label for="zip">ZIP or postal code</label>
      <input id="zip" name="postal_code" type="text" />

      <label for="country">Country</label>
      <input id="country" name="country" type="text" />

      <label for="notes">Comments</label>
      <textarea id="notes" name="comments" rows="4"></textarea>
    </form>
  </body>
</html>
